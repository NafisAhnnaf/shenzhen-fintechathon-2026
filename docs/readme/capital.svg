<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-label="Grouped bars: pooled reserve K versus per-payment reserves for each setting"><style>
text{font-family:'Nunito Sans','Segoe UI',Helvetica,Arial,sans-serif;fill:#4A4775}
.t{font-family:Fredoka,'Trebuchet MS','Segoe UI',sans-serif;font-size:22px;font-weight:600;fill:#1E1B4B}
.s{font-size:13px;fill:#6B6799}
.v{font-size:15px;font-weight:800;fill:#1E1B4B}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.up{transform-box:fill-box;transform-origin:center bottom;animation:up 1.1s cubic-bezier(.2,.8,.2,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both}
.fade{animation:fade .8s ease both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes up{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.grow,.up,.pop,.fade{animation:none}}
</style><rect width="760" height="410" rx="18" fill="#FFFFFF" stroke="#DAD6FB"/><text x="28" y="44" class="t">The bond: same 99% promise, a fraction of the money</text><text x="28" y="68" class="s">Reserve needed per setting · pooled bound K(β) vs. a separate reserve per payment (Chen-style union bound)</text><line x1="90" x2="730" y1="330.0" y2="330.0" stroke="#DAD6FB"/><text x="80" y="334.0" text-anchor="end" class="s">$0k</text><line x1="90" x2="730" y1="272.5" y2="272.5" stroke="#DAD6FB"/><text x="80" y="276.5" text-anchor="end" class="s">$200k</text><line x1="90" x2="730" y1="215.0" y2="215.0" stroke="#DAD6FB"/><text x="80" y="219.0" text-anchor="end" class="s">$400k</text><line x1="90" x2="730" y1="157.5" y2="157.5" stroke="#DAD6FB"/><text x="80" y="161.5" text-anchor="end" class="s">$600k</text><line x1="90" x2="730" y1="100.0" y2="100.0" stroke="#DAD6FB"/><text x="80" y="104.0" text-anchor="end" class="s">$800k</text><rect class="up" style="animation-delay:0.00s" x="118.3" y="243.8" width="44.1" height="86.2" rx="6" fill="#C7C2EE"/><text class="fade" style="animation-delay:0.70s;font-size:12px;font-weight:700;fill:#1E1B4B" x="140.4" y="237.8" text-anchor="middle">$300k</text><rect class="up" style="animation-delay:0.10s" x="168.4" y="304.6" width="44.1" height="25.4" rx="6" fill="#4B3BD6"/><text class="fade" style="animation-delay:0.70s;font-size:12px;font-weight:700;fill:#1E1B4B" x="190.5" y="298.6" text-anchor="middle">$88k</text><text x="165.4" y="352" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#1E1B4B">Careful</text><text x="165.4" y="370" text-anchor="middle" class="s">3.4× less</text><rect class="up" style="animation-delay:0.15s" x="275.9" y="200.6" width="44.1" height="129.4" rx="6" fill="#C7C2EE"/><text class="fade" style="animation-delay:0.85s;font-size:12px;font-weight:700;fill:#1E1B4B" x="297.9" y="194.6" text-anchor="middle">$450k</text><rect class="up" style="animation-delay:0.25s" x="326.0" y="312.1" width="44.1" height="17.9" rx="6" fill="#4B3BD6"/><text class="fade" style="animation-delay:0.85s;font-size:12px;font-weight:700;fill:#1E1B4B" x="348.0" y="306.1" text-anchor="middle">$62k</text><text x="323.0" y="352" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#1E1B4B">Standard</text><text x="323.0" y="370" text-anchor="middle" class="s">7.2× less</text><rect class="up" style="animation-delay:0.30s" x="433.4" y="157.5" width="44.1" height="172.5" rx="6" fill="#C7C2EE"/><text class="fade" style="animation-delay:1.00s;font-size:12px;font-weight:700;fill:#1E1B4B" x="455.4" y="151.5" text-anchor="middle">$600k</text><rect class="up" style="animation-delay:0.40s" x="483.5" y="311.7" width="44.1" height="18.3" rx="6" fill="#4B3BD6"/><text class="fade" style="animation-delay:1.00s;font-size:12px;font-weight:700;fill:#1E1B4B" x="505.5" y="305.7" text-anchor="middle">$64k</text><text x="480.5" y="352" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#1E1B4B">More</text><text x="480.5" y="370" text-anchor="middle" class="s">9.4× less</text><rect class="up" style="animation-delay:0.45s" x="590.9" y="114.4" width="44.1" height="215.6" rx="6" fill="#C7C2EE"/><text class="fade" style="animation-delay:1.15s;font-size:12px;font-weight:700;fill:#1E1B4B" x="612.9" y="108.4" text-anchor="middle">$750k</text><rect class="up" style="animation-delay:0.55s" x="641.0" y="309.8" width="44.1" height="20.2" rx="6" fill="#4B3BD6"/><text class="fade" style="animation-delay:1.15s;font-size:12px;font-weight:700;fill:#1E1B4B" x="663.0" y="303.8" text-anchor="middle">$70k</text><text x="638.0" y="352" text-anchor="middle" style="font-size:14px;font-weight:800;fill:#1E1B4B">Most</text><text x="638.0" y="370" text-anchor="middle" class="s">10.7× less</text><rect x="90" y="376" width="12" height="12" rx="3" fill="#C7C2EE"/><text x="108" y="386" class="s">separate reserve per payment</text><rect x="320" y="376" width="12" height="12" rx="3" fill="#4B3BD6"/><text x="338" y="386" class="s">