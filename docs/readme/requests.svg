<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Request box red team: 68 hostile requests"><style>
text{font-family:'Nunito Sans','Segoe UI',Helvetica,Arial,sans-serif;fill:#4A4775}
