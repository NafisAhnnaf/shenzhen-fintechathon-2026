<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Payments fraud is the norm, AI defence is rare"><style>
text{font-family:'Nunito Sans','Segoe UI',Helvetica,Arial,sans-serif;fill:#4A4775}
.t{font-family:Fredoka,'Trebuchet MS','Segoe UI',sans-serif;font-size:22px;font-weight:600;fill:#1E1B4B}
.s{font-size:13px;fill:#6B6799}
.v{font-size:15px;font-weight:800;fill:#1E1B4B}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.up{transform-box:fill-box;transform-origin:center bottom;animation:up 1.1s cubic-bezier(.2,.8,.2,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both}
.fade{animation:fade .8s ease both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes up{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.grow,.up,.pop,.fade{animation:none}}
</style><rect width="760" height="330" rx="18" fill="#FFFFFF" stroke="#DAD6FB"/><text x="28" y="44" class="t">Payments fraud is the norm, AI defence is rare</text><text x="28" y="68" class="s">Share of US organisations, 2025</text><text x="28" y="112" style="font-size:15px;font-weight:700;fill:#1E1B4B">Faced payments fraud</text><rect x="308" y="92" width="362" height="30" rx="9" fill="#E4E0FF" opacity=".55"/><rect class="grow" style="animation-delay:0.00s" x="308" y="92" width="275.1" height="30" rx="9" fill="#7A2E9E"/><text class="fade v" style="animation-delay:0.60s" x="593.1" y="112">76%</text><text x="28" y="160" style="font-size:15px;font-weight:700;fill:#1E1B4B">Hit by business email compromise</text><rect x="308" y="140" width="362" height="30" rx="9" fill="#E4E0FF" opacity=".55"/><rect class="grow" style="animation-delay:0.15s" x="308" y="140" width="267.9" height="30" rx="9" fill="#7A2E9E"/><text class="fade v" style="animation-delay:0.75s" x="585.9" y="160">74%</text><text x="28" y="208" style="font-size:15px;font-weight:700;fill:#1E1B4B">Hit by check fraud</text><rect x="308" y="188" width="362" height="30" rx="9" fill="#E4E0FF" opacity=".55"/><rect class="grow" style="animation-delay:0.30s" x="308" y="188" width="210.0" height="30" rx="9" fill="#6D5BFF"/><text class="fade v" style="animation-delay:0.90s" x="528.0" y="208">58%</text><text x="28" y="256" style="font-size:15px;font-weight:700;fill:#1E1B4B">Use AI to fight payments fraud</text><rect x="308" y="236" width="362" height="30" rx="9" fill="#E4E0FF" opacity=".55"/><rect class="grow" style="animation-delay:0.45s" x="308" y="236" width="61.5" height="30" rx="9" fill="#1F4CB8"/><text class="fade v" style="animation-delay:1.05s" x="379.5" y="256">17%</text><text x="28" y="312" class="s">Source: AFP 2026 Payments Fraud and Control Survey (465 treasury practitioners)</text></svg>