# Tests on every push and pull request: Python (offline: no model, mail or production database), the contracts,
# Slither static analysis of the contracts, and a type-checked web build.
name: ci
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env: { STATE_STORE: file, INJECTION_MODEL: "off", FX_SOURCE: "off" }

  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: chain } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: chain/package-lock.json }
      - run: npm ci
      - run: npx hardhat test

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: chain/package-lock.json }
      - run: cd chain && npm ci && npx hardhat compile
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install slither-analyzer==0.10.4
      # Fail on high-impact findings; medium and low findings are reviewed in docs/security_self_assessment.md.
      - run: cd chain && slither . --hardhat-ignore-compile --filter-paths "node_modules|test" --exclude-informational --exclude-optimization --exclude-low --exclude-medium --fail-high

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
