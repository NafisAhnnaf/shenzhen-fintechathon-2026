<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="A checklist"><style>.bob{animation:bob 3.2s ease-in-out infinite}.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}.wave{transform-box:fill-box;transform-origin:20% 95%;animation:wave 1.6s ease-in-out infinite}.sway,.antenna{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="20" y="20" width="120" height="164" rx="14" fill="#fff" stroke="#8B7DFF" stroke-width="5"/><rect x="56" y="10" width="48" height="22" rx="8" fill="#4B3BD6"/><g stroke="#2F64E0" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M38 60 l10 10 l18 -20"/><path d="M38 100 l10 10 l18 -20"/><path d="M38 140 l10 10 l18 -20"/></g><g fill="#DAD6FB"><rect x="76" y="58" width="48" height="8" rx="4"/><rect x="76" y="98" width="48" height="8" rx="4"/><rect x="76" y="138" width="48" height="8" rx="4"/></g></svg>