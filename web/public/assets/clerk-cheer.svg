<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" role="img" aria-label="The AI clerk" ><style>.bob{animation:bob 3.2s ease-in-out infinite}.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}.wave{transform-box:fill-box;transform-origin:20% 95%;animation:wave 1.6s ease-in-out infinite}.sway,.antenna{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="100" cy="250" rx="66" ry="8" fill="#D6D0FF"/><g class="bob"><rect x="52" y="122" width="96" height="112" rx="30" fill="#6D5BFF"/><rect x="80" y="148" width="40" height="24" rx="6" fill="#fff"/><rect x="86" y="157" width="28" height="6" rx="3" fill="#6D5BFF"/><rect x="18" y="70" width="26" height="72" rx="13" fill="#4B3BD6" transform="rotate(-24 31 106)"/><rect x="156" y="70" width="26" height="72" rx="13" fill="#4B3BD6" transform="rotate(24 169 106)"/><rect x="70" y="228" width="22" height="18" rx="8" fill="#4B3BD6"/><rect x="108" y="228" width="22" height="18" rx="8" fill="#4B3BD6"/><g><g class="antenna"><line x1="100" y1="34" x2="100" y2="14" stroke="#8B7DFF" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="12" r="8" fill="#9CC3FF"/></g><rect x="44" y="32" width="112" height="92" rx="36" fill="#8B7DFF"/><rect x="60" y="52" width="80" height="52" rx="22" fill="#1E1B4B"/><path d="M76 78 Q84 68 92 78" stroke="#9CC3FF" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M108 78 Q116 68 124 78" stroke="#9CC3FF" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M86 90 Q100 102 114 90" stroke="#9CC3FF" stroke-width="4" fill="none" stroke-linecap="round"/></g></g></svg>