<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" role="img" aria-label="The finance manager"><style>.bob{animation:bob 3.2s ease-in-out infinite}.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}.wave{transform-box:fill-box;transform-origin:20% 95%;animation:wave 1.6s ease-in-out infinite}.sway,.antenna{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="100" cy="250" rx="66" ry="8" fill="#D6D0FF"/><g class="bob"><path d="M50 240 Q50 132 100 132 Q150 132 150 240 Z" fill="#8B7DFF"/><rect x="112" y="150" width="44" height="58" rx="6" fill="#fff" stroke="#4B3BD6" stroke-width="4"/><rect x="122" y="144" width="24" height="10" rx="4" fill="#4B3BD6"/><path d="M120 170 h28 M120 182 h22" stroke="#C7BFFF" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="88" r="40" fill="#F2DFD3"/><circle cx="100" cy="44" r="16" fill="#2B2560"/><path d="M60 90 Q60 50 100 50 Q140 50 140 90 Q130 66 100 66 Q70 66 60 90 Z" fill="#2B2560"/><g class="blink"><circle cx="86" cy="92" r="4" fill="#1E1B4B"/><circle cx="114" cy="92" r="4" fill="#1E1B4B"/></g><path d="M90 108 Q100 114 110 108" stroke="#1E1B4B" stroke-width="3" fill="none" stroke-linecap="round"/></g></svg>