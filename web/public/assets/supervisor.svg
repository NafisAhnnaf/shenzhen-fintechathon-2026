<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" role="img" aria-label="The supervisor, a blue robot holding a stamp"><style>.bob{animation:bob 3.2s ease-in-out infinite}.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}.wave{transform-box:fill-box;transform-origin:20% 95%;animation:wave 1.6s ease-in-out infinite}.sway,.antenna{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="100" cy="250" rx="66" ry="8" fill="#BFD3FF"/><g class="bob"><rect x="52" y="122" width="96" height="112" rx="24" fill="#2F64E0"/><rect x="26" y="132" width="26" height="72" rx="13" fill="#1F4CB8"/><rect x="148" y="126" width="26" height="60" rx="13" fill="#1F4CB8"/><rect x="136" y="180" width="52" height="22" rx="6" fill="#6D5BFF"/><rect x="150" y="202" width="24" height="12" rx="3" fill="#4B3BD6"/><rect x="46" y="40" width="108" height="86" rx="22" fill="#3E7BFA"/><rect x="62" y="60" width="76" height="46" rx="14" fill="#1E1B4B"/><g class="blink"><rect x="74" y="78" width="18" height="6" rx="3" fill="#9CC3FF"/><rect x="108" y="78" width="18" height="6" rx="3" fill="#9CC3FF"/></g><path d="M44 46 Q100 4 156 46 Z" fill="#1E1B4B"/><rect x="38" y="42" width="124" height="10" rx="5" fill="#1E1B4B"/></g></svg>