<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><style>.bob{animation:bob 3.2s ease-in-out infinite}.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}.wave{transform-box:fill-box;transform-origin:20% 95%;animation:wave 1.6s ease-in-out infinite}.sway,.antenna{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="4" y="10" width="56" height="46" rx="18" fill="#8B7DFF"/><rect x="12" y="20" width="40" height="26" rx="11" fill="#1E1B4B"/><g class="blink"><circle cx="24" cy="33" r="4" fill="#9CC3FF"/><circle cx="40" cy="33" r="4" fill="#9CC3FF"/></g><circle cx="32" cy="5" r="4" fill="#9CC3FF"/></svg>