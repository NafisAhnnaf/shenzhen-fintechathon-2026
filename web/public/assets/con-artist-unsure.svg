<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" role="img" aria-label="The con artist"><style>.bob{animation:bob 3.2s ease-in-out infinite}.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}.wave{transform-box:fill-box;transform-origin:20% 95%;animation:wave 1.6s ease-in-out infinite}.sway,.antenna{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="100" cy="250" rx="66" ry="8" fill="#D6D0FF"/><g class="sway"><path d="M58 124 L142 124 L164 242 L36 242 Z" fill="#3B2A73"/><path d="M100 124 L78 182 L100 166 L122 182 Z" fill="#251A52"/><rect x="140" y="140" width="50" height="36" rx="6" fill="#fff" stroke="#B8AEFF" stroke-width="3" transform="rotate(-12 165 158)"/><circle cx="100" cy="92" r="36" fill="#55449C"/><rect x="64" y="78" width="72" height="18" rx="9" fill="#1E1B4B"/><g class="blink"><circle cx="86" cy="87" r="4" fill="#C7BFFF"/><circle cx="114" cy="87" r="4" fill="#C7BFFF"/></g><path d="M88 110 L112 110" stroke="#C7BFFF" stroke-width="4" stroke-linecap="round"/><ellipse cx="100" cy="62" rx="60" ry="10" fill="#1E1B4B"/><rect x="70" y="26" width="60" height="38" rx="10" fill="#1E1B4B"/><rect x="70" y="50" width="60" height="8" fill="#7C5CFF"/></g></svg>