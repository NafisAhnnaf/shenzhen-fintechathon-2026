<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" role="img" aria-label="The owner"><style>.bob{animation:bob 3.2s ease-in-out infinite}.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}.wave{transform-box:fill-box;transform-origin:20% 95%;animation:wave 1.6s ease-in-out infinite}.sway,.antenna{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="100" cy="250" rx="66" ry="8" fill="#D6D0FF"/><g class="bob"><path d="M50 240 Q50 132 100 132 Q150 132 150 240 Z" fill="#2F64E0"/><path d="M92 134 L108 134 L104 190 L100 198 L96 190 Z" fill="#1E1B4B"/><circle cx="100" cy="88" r="40" fill="#F2DFD3"/><path d="M60 84 Q62 44 100 44 Q140 44 140 84 Q128 62 100 62 Q72 62 60 84 Z" fill="#2B2560"/><g class="blink"><circle cx="86" cy="92" r="4" fill="#1E1B4B"/><circle cx="114" cy="92" r="4" fill="#1E1B4B"/></g><path d="M90 108 Q100 114 110 108" stroke="#1E1B4B" stroke-width="3" fill="none" stroke-linecap="round"/></g></svg>