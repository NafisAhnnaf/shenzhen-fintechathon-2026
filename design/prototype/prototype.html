<title>Payables Desk Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='10' width='56' height='46' rx='18' fill='%238B7DFF'/%3E%3Crect x='12' y='20' width='40' height='26' rx='11' fill='%231E1B4B'/%3E%3Ccircle cx='24' cy='33' r='4' fill='%239CC3FF'/%3E%3Ccircle cx='40' cy='33' r='4' fill='%239CC3FF'/%3E%3Ccircle cx='32' cy='5' r='4' fill='%239CC3FF'/%3E%3C/svg%3E">
<style>
/* Layout: a marketing landing page, a wallet login, then an app shell (header, desk with queue + detail, risk, security, activity, settings).
   One light lavender world; the AI clerk (violet robot) and the con artist (plum, fedora) carry the story. */
:root{
  --bg:#F6F5FF; --surface:#FFFFFF; --sunk:#EEECFF; --line:#DAD6FB;
  --ink:#1E1B4B; --body:#4A4775; --muted:#6B6799;
  --primary:#4B3BD6; --primary-2:#6D5BFF; --primary-hover:#3C2EB8; --lilac:#E4E0FF; --lilac-2:#C7BFFF;
  --done:#1F4CB8; --done-bg:#DCE8FF; --stop:#7A2E9E; --stop-bg:#F1E4FB; --sky:#9CC3FF; --night:#1E1B4B;
  --f-display:"Fredoka", "Trebuchet MS", sans-serif;
  --f-body:"Nunito Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r-ctl:10px; --r-card:16px;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--primary)}
a:hover{color:var(--primary-hover)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,4vw,32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--r-ctl);border:1px solid transparent;font-weight:700;font-size:15px;text-decoration:none;transition:background .15s,transform .1s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);color:#fff}
.btn-primary:disabled{background:#8F86E0}
.btn-quiet{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-quiet:hover{background:var(--sunk);color:var(--ink)}
.btn-quiet:disabled{background:var(--sunk);color:#8F8BB5}
.btn-stop{background:var(--surface);border-color:var(--stop);color:var(--stop)}
.btn-stop:hover{background:var(--stop-bg)}
.btn-link{background:none;border:0;color:var(--primary);padding:0 6px;min-height:44px;font-weight:700}
.btn-lg{min-height:52px;padding:0 26px;font-size:16px;border-radius:12px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite}
.spin.dark{border-color:var(--lilac-2);border-top-color:var(--primary)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:4px 11px;border-radius:999px;white-space:nowrap}
.b-done{background:var(--done-bg);color:var(--done)}
.b-attn{background:var(--lilac);color:#3C2EB8}
.b-stop{background:var(--stop-bg);color:var(--stop)}
.b-idle{background:var(--sunk);color:var(--body)}
.hash{font-family:var(--f-mono);font-size:13px;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--primary);text-decoration:none;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card)}
.eyebrow{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--primary)}
.err{color:var(--stop);font-weight:700;font-size:14px}
.ok{color:var(--done);font-weight:700}

/* character motion (lottie-style loops, CSS only) */
.bob{animation:bob 3.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.wave{transform-box:fill-box;transform-origin:20% 95%;animation:wave 1.6s ease-in-out infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.6s ease-in-out infinite}
.antenna{transform-box:fill-box;transform-origin:50% 100%;animation:sway 1.8s ease-in-out infinite}
.float{animation:float 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes blurin{from{opacity:0;filter:blur(10px);transform:translateY(8px)}to{opacity:1;filter:none;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes shine{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.08)}}
@keyframes dash{to{stroke-dashoffset:0}}
.pop-in{animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both}
.rise-in{animation:rise .5s ease both}

/* BlurText (React Bits-style): words resolve one by one, resting state fully visible */
.blurtext span{display:inline-block;animation:blurin .7s ease both}
/* ShinyText */
.shiny{background:linear-gradient(110deg,var(--primary) 35%,#A99CFF 50%,var(--primary) 65%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.5s linear infinite}
/* SpotlightCard */
.spot{position:relative;overflow:hidden}
.spot::before{content:"";position:absolute;inset:0;background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),rgba(109,91,255,.14),transparent 60%);opacity:0;transition:opacity .25s;pointer-events:none}
.spot:hover::before{opacity:1}
/* ClickSpark */
.spark{position:fixed;width:6px;height:6px;border-radius:50%;background:var(--primary-2);pointer-events:none;z-index:999;animation:spark .5s ease-out forwards}

/* ---------- landing ---------- */
.l-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(246,245,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.l-nav.scrolled{border-bottom-color:var(--line)}
.l-nav .wrap{display:flex;align-items:center;gap:24px;min-height:68px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--ink);text-decoration:none}
.l-links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;align-items:center}
.l-links button{background:none;border:0;padding:10px 12px;border-radius:8px;color:var(--body);font-weight:700;min-height:44px}
.l-links button:hover{background:var(--sunk);color:var(--ink)}
.hero{position:relative;overflow:hidden;padding-block:56px 40px}
.aurora{position:absolute;inset:-20% -10% auto -10%;height:120%;pointer-events:none;z-index:0}
.aurora i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 14s ease-in-out infinite}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center}
.hero h1{font-size:clamp(40px,6vw,72px);letter-spacing:-.01em}
.hero p.lead{font-size:clamp(17px,2vw,20px);color:var(--body);max-width:56ch;margin-top:20px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.stage{position:relative;display:grid;place-items:center;min-height:440px}
.stage .disc{position:absolute;width:min(420px,90%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--lilac) 0,var(--lilac) 58%,rgba(228,224,255,0) 72%)}
.bubble{position:absolute;top:24px;right:4%;max-width:260px;background:var(--surface);border:2px solid var(--primary-2);border-radius:20px 20px 20px 6px;padding:12px 16px;font-weight:700;font-size:15px;box-shadow:0 12px 30px rgba(30,27,75,.10);min-height:52px}
.chip-float{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;box-shadow:0 10px 24px rgba(30,27,75,.08)}
.proof{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-block:28px}
.proof div{padding:20px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line)}
.proof b{display:block;font-family:var(--f-display);font-size:40px;color:var(--primary);line-height:1}
.proof span{display:block;margin-top:6px;color:var(--body);font-size:15px}
.section{padding-block:72px}
.section h2{font-size:clamp(30px,4vw,44px)}
.section .intro{color:var(--body);font-size:18px;max-width:62ch;margin-top:12px}
.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:32px}
.day{padding:22px;display:flex;flex-direction:column;gap:10px}
.day .stamp{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.1em;color:var(--primary)}
.day h3{font-size:22px}
.day p{color:var(--body);font-size:15px}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:32px;position:relative}
.pipe .st{padding:22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.pipe .st .ring{width:132px;height:132px;border-radius:50%;background:var(--lilac);display:grid;place-items:center}
.pipe .st h3{font-size:20px}
.pipe .st p{color:var(--body);font-size:15px}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:32px}
.split .side{padding:26px;display:flex;gap:18px;align-items:center}
.idrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--sunk);flex-wrap:wrap}
.dialprev{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:28px}
.dialprev div{padding:18px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line)}
.dialprev b{font-family:var(--f-display);font-size:34px;color:var(--primary);display:block}
.cta-band{margin-block:24px 72px;padding:44px;border-radius:28px;background:var(--night);color:#F6F5FF;display:flex;gap:32px;align-items:center;flex-wrap:wrap}
.cta-band h2{font-size:clamp(28px,4vw,42px);color:#F6F5FF}
.cta-band p{color:#D6D2FF;margin-top:10px;max-width:52ch}
.footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:14px}
.footer .wrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.login .art{background:var(--night);color:#F6F5FF;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;position:relative;overflow:hidden}
.login .art h2{color:#F6F5FF;font-size:clamp(28px,3.4vw,40px);max-width:16ch}
.login .art p{color:#D6D2FF;max-width:42ch}
.login .panel{padding:48px clamp(16px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:22px;max-width:620px}
.roles{display:grid;gap:10px}
.role{display:flex;gap:14px;align-items:center;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.role[aria-checked="true"]{border-color:var(--primary);background:#F3F1FF}
.role .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--lilac-2);flex:none;display:grid;place-items:center}
.role[aria-checked="true"] .dot{border-color:var(--primary)}
.role[aria-checked="true"] .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.wallets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wallets .btn{flex-direction:column;min-height:84px;gap:6px;font-size:14px}

/* ---------- app shell ---------- */
.app-h{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.app-h .wrap{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.app-nav{display:flex;gap:4px;flex-wrap:wrap}
.app-nav a{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;color:var(--body);text-decoration:none;font-weight:700;min-height:40px}
.app-nav a:hover{background:var(--sunk);color:var(--ink)}
.app-nav a[aria-current="page"]{background:var(--sunk);color:var(--ink)}
.app-nav svg{width:18px;height:18px}
.who{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.net{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.net i{width:9px;height:9px;border-radius:50%;background:var(--done)}
.net.paused{color:var(--stop);font-weight:800}.net.paused i{background:var(--stop)}
.rolechip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);min-height:44px}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:280px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(30,27,75,.14);padding:8px;z-index:30}
.menu button{width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;min-height:44px;font-weight:600}
.menu button:hover{background:var(--sunk)}
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;margin-top:16px;font-size:15px}
.banner.night{background:var(--night);color:#F6F5FF}
.banner.stop{background:var(--stop-bg)}
.banner.attn{background:var(--lilac)}
main.app{padding-block:24px 64px}

.reqbar{display:flex;gap:12px;flex-wrap:wrap}
.reqbar input{flex:1 1 420px;min-width:0;height:54px;padding:0 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font:16px var(--f-body);color:var(--ink)}
.reqbar input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 4px rgba(109,91,255,.18)}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sugg button{background:var(--surface);border:1px dashed var(--lilac-2);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--body);min-height:36px}
.sugg button:hover{border-style:solid;color:var(--ink)}
.desk{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
.qcol{display:flex;flex-direction:column;gap:18px}
.qcol .card{padding:16px}
.qh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.qh h2{font-family:var(--f-body);font-size:15px;font-weight:800}
.qitem{display:flex;justify-content:space-between;gap:10px;width:100%;padding:11px 12px;border:0;border-radius:10px;background:none;text-align:left;font-size:15px;align-items:flex-start}
.qitem:hover{background:var(--sunk)}
.qitem[aria-current="true"]{background:var(--sunk);box-shadow:inset 0 0 0 2px var(--lilac-2)}
.qitem small{display:block;font-size:13.5px;font-weight:800}
.qlabel{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--muted);margin:10px 0 4px}
.detail{padding:clamp(20px,3vw,36px);min-height:520px;min-width:0}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;min-height:460px}
.empty h2{font-size:26px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.step{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--sunk)}
.step .r{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chart{width:100%;height:auto;display:block}
.fp{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;padding:22px;border-radius:14px;background:var(--bg)}
.fp dl{margin:0;display:flex;flex-direction:column;gap:12px}
.fp dt{font-size:13.5px;color:var(--muted)}.fp dd{margin:0;font-size:20px;font-weight:800}
.tally{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:15px}
.tally span:nth-child(odd){color:var(--muted)}

/* risk */
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-right:1px solid var(--line);background:var(--surface);padding:16px 18px;text-align:left;min-height:84px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--lilac);box-shadow:inset 0 -4px 0 var(--primary)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.stats b{display:block;font-family:var(--f-display);font-size:38px;color:var(--ink);line-height:1.05}
.stats span{font-size:14px;color:var(--muted)}

/* modal (fake wallet) */
.scrim{position:fixed;inset:0;background:rgba(30,27,75,.45);display:grid;place-items:center;z-index:60;padding:16px}
.wallet{width:min(420px,100%);background:var(--surface);border-radius:20px;box-shadow:0 30px 80px rgba(30,27,75,.35);overflow:hidden}
.wallet header{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--sunk);font-weight:800}
.wallet .body{padding:20px;display:flex;flex-direction:column;gap:12px}
.wallet pre{margin:0;padding:12px;border-radius:10px;background:var(--bg);font:12.5px/1.6 var(--f-mono);white-space:pre-wrap;word-break:break-word;color:var(--body)}
.wallet footer{display:flex;gap:10px;padding:0 20px 20px}
.wallet footer .btn{flex:1}

/* toasts + prototype panel */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:70;max-width:min(420px,calc(100% - 32px))}
.toast{display:flex;gap:12px;align-items:center;padding:13px 16px;border-radius:14px;background:var(--night);color:#F6F5FF;box-shadow:0 14px 30px rgba(30,27,75,.3);animation:rise .35s ease both;font-size:15px}
.toast .hash{background:#2A2668;color:var(--sky)}
.proto{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:65}
.proto>button{min-height:44px;border-radius:999px;padding:0 16px;border:1px solid var(--lilac-2);background:var(--surface);font-weight:800;box-shadow:0 10px 24px rgba(30,27,75,.12);display:flex;align-items:center;gap:8px}
.proto .pp{position:absolute;left:0;bottom:56px;width:300px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px rgba(30,27,75,.18);padding:14px;display:flex;flex-direction:column;gap:6px}
.proto label{display:flex;gap:10px;align-items:center;min-height:36px;font-size:14.5px}
.proto select{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:14px var(--f-body);background:var(--surface);color:var(--ink)}

/* responsive */
@media (max-width: 980px){
  .hero .wrap,.login{grid-template-columns:minmax(0,1fr)}
  .stage{min-height:340px}
  .proof,.days,.pipe,.dialprev,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .desk{grid-template-columns:minmax(0,1fr)}
  .login .art{min-height:280px}
}
@media (max-width: 620px){
  .proof,.days,.pipe,.dialprev,.split,.stats,.wallets{grid-template-columns:minmax(0,1fr)}
  .seg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg button:nth-child(2){border-right:0}
  .fp{grid-template-columns:minmax(0,1fr)}
  .bubble{right:0;top:0}
  .cta-band{padding:28px}

function countUp(root) {
  root.querySelectorAll("[data-count]").forEach((el) => {
    const end = parseFloat(el.dataset.count), dec = +(el.dataset.dec || 0), pre = el.dataset.pre || "", suf = el.dataset.suf || "";

    const step = (t) => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(end * e); if (k < 1) requestAnimationFrame(step); };

}

function detail() {

/* ---- request handling ---- */
function ask(text) {
  const q = text.toLowerCase().trim();
  S.req = text; S.selected = null; S.plan = null; S.answer = null;
  if (!q) return;
  if (/(bank|account|payee|wallet address)/.test(q) && /(add|change|new|update)/.test(q)) S.answer = { kind: "unsupported" };
  else if (/copper/.test(q) && /pay/.test(q) && !/what/.test(q)) S.answer = { kind: "which" };
  else if (/acme/.test(q) && /pay/.test(q)) S.plan = makePlan("acme");
  else if (/why/.test(q)) S.answer = { kind: "why" };
  else if (/owe/.test(q)) S.answer = { kind: "status" };
  else if (/what (happens|if)/.test(q)) S.answer = { kind: "whatif" };
  else if (/careful/.test(q)) S.plan = S.role === "owner" ? makePlan("dial", "careful") : null, S.answer = S.role === "owner" ? null : { kind: "owneronly", what: "the risk setting" };
  else if (/(more on its own|pay more)/.test(q)) S.plan = S.role === "owner" ? makePlan("dial", "most") : null, S.answer = S.role === "owner" ? null : { kind: "owneronly", what: "the risk setting" };
  else if (/(stop all|pause)/.test(q)) S.plan = makePlan("pause");
  else if (/(start again|resume)/.test(q)) S.plan = S.role === "owner" ? makePlan("resume") : null, S.answer = S.role === "owner" ? null : { kind: "owneronly", what: "resume the agent" };
  else S.answer = { kind: "unsupported" };
  log(S.role === "manager" ? "finance manager" : S.role, "Request: “" + text + "”");
}
function makePlan(kind, arg) {
  if (kind === "acme") {
    const steps = ["ACM41", "ACM44", "ACM47"].filter((k) => S.bills[k].status === "ready").map((k) => ({ id: k, title: "Pay " + S.bills[k].inv, sub: "Due " + S.bills[k].due + " · checks passed", amount: S.bills[k].amount, tier: "t1", status: "planned" }));
    if (S.bills.ACM50.status === "needs") steps.push({ id: "ACM50", title: "Send " + S.bills.ACM50.inv + " for signature", sub: "Above the per-payment limit of $5,000", amount: S.bills.ACM50.amount, tier: "t2", status: "planned" });
    const alone = steps.filter((s) => s.tier === "t1").reduce((a, s) => a + s.amount, 0);
    return { kind, intent: "PAY-SET", title: steps.length ? `Pay Acme Metals (HK) Ltd: ${steps.filter((s) => s.tier === "t1").length} bills for ${money(alone)} on its own${S.bills.ACM50.status === "needs" ? " and 1 bill for " + money(S.bills.ACM50.amount) + " after the finance manager signs" : ""}.` : "Nothing from Acme is due this week.", steps, left: [{ inv: "ACM-2512038", why: "disputed" }], status: "preview", cashAfter: 650000 - alone };
  }
  if (kind === "dial") { const b = BUNDLES[arg]; return { kind, arg, intent: "SET-DIAL", title: `Change the risk setting to ${b.label}: pays alone about ${Math.round(b.t1)}% of bills, at most ${b.nday} a day and ${money(b.pday, 0)}, reserve ${money(b.K, 0)}.`, steps: [{ title: "Change the risk setting on-chain", sub: "Owner signs in their wallet" + (S.mode === "bonded" ? "; the underwriter co-signs" : ""), tier: "t3", status: "planned" }], status: "preview" }; }
  if (kind === "pause") return { kind, intent: "PAUSE", title: "Pause the agent: every bill goes to a person until the owner resumes.", steps: [{ title: "Pause the agent on-chain", sub: "Protective: runs at once", tier: "p", status: "planned" }], status: "preview" };
  if (kind === "resume") return { kind, intent: "RESUME", title: "Resume the agent.", steps: [{ title: "Resume the agent on-chain", sub: "Owner signs in their wallet", tier: "t3", status: "planned" }], status: "preview" };
}
function vAnswer() {
  const a = S.answer;
  const ex = `<div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">${["Pay Acme’s bills due this week except the disputed one", "Why was bill 0412 held?", "Be more careful this month"].map((s) => `<button class="btn btn-quiet" style="justify-content:flex-start;white-space:normal;text-align:left" data-act="try" data-q="${esc(s)}">${esc(s)}</button>`).join("")}</div>`;
  if (a.kind === "which") return `<div style="display:flex;gap:24px;flex-wrap:wrap;align-items:center">${C.clerk("think", 120)}<div style="flex:1 1 360px"><p class="eyebrow">One question before I plan</p><h2 style="font-size:28px;margin-top:8px">Which supplier do you mean?</h2><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">${["Acme Metals (HK) Ltd", "Lion Rock Copper Trading Ltd", "Ganjiang Copper Products Co., Ltd."].map((s, i) => `<button class="btn btn-quiet" style="border-color:var(--primary);color:var(--primary);border-radius:999px" data-act="pickslot" data-i="${i}">${esc(s)}</button>`).join("")}</div><p class="muted" style="margin-top:12px;font-size:14px">At most three choices, never a second question.</p></div></div>`;
  if (a.kind === "unsupported") return `<div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start">${C.clerk("stop", 110)}<div style="flex:1 1 360px"><h2 style="font-size:26px">I can’t do that here. Here is what I can do:</h2>${ex}<p class="muted" style="margin-top:12px;font-size:14px">Payees and bank details change only in the owner’s Settings, never through a request.</p></div></div>`;
  if (a.kind === "owneronly") return `<div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start">${C.clerk("stop", 110)}<div style="flex:1 1 360px"><h2 style="font-size:26px">Only the owner can ${esc(a.what)}.</h2>${ex}</div></div>`;

let runTimer = null;
function runPlan() {
  const p = S.plan;
  if (p.kind === "dial") return wallet("Change the risk setting", `proposeSettings(\n  mode: ${S.mode},\n  bundle: ${BUNDLES[p.arg].label},\n  perDay: ${BUNDLES[p.arg].nday} payments, ${money(BUNDLES[p.arg].pday, 0)},\n  reservePerPayment: ${money(BUNDLES[p.arg].r, 0)}\n)`, () => { S.bundle = p.arg; p.steps[0].status = "done"; p.steps[0].hash = hash(); p.status = "done"; log("owner", "Risk setting changed to " + BUNDLES[p.arg].label, p.steps[0].hash); toast("Risk setting is now " + BUNDLES[p.arg].label, p.steps[0].hash); render(); });
  if (p.kind === "resume") return wallet("Resume the agent", "unpauseAgent()", () => { S.paused = false; p.steps[0].status = "done"; p.steps[0].hash = hash(); p.status = "done"; log("owner", "Resumed the agent", p.steps[0].hash); render(); });
  if (p.kind === "pause") { S.paused = true; S.pausedBy = "Paused by " + ROLE_NAME[S.role].toLowerCase() + "."; p.steps[0].status = "done"; p.steps[0].hash = hash(); p.status = "done"; log(S.role === "manager" ? "finance manager" : "owner", "Paused the agent", p.steps[0].hash, true); render(); return; }
  p.status = "running"; render();
  let i = 0;
  const next = () => {
    if (S.plan !== p || p.status !== "running") return;
    if (i >= p.steps.length) { p.status = "done"; render(); return; }
    const s = p.steps[i];
    if (s.tier === "t2" || S.paused) { s.status = "needs"; if (S.paused && s.tier === "t1") { S.bills[s.id].status = "needs"; } i++; render(); runTimer = setTimeout(next, 500); return; }
    s.status = "paying"; render();
    runTimer = setTimeout(() => {
      if (S.plan !== p || p.status !== "running") return;
      s.status = "paid"; s.hash = hash(); S.bills[s.id].status = "paid"; S.bills[s.id].hash = s.hash;
      S.tally.t1 += s.amount; S.tally.t1n++;
      log("contract", "Paid " + S.bills[s.id].inv + " on its own, " + money(s.amount), s.hash);
      i++; render(); runTimer = setTimeout(next, 450);
    }, 900);
  };
  next();
}

    addpayee() { toast("Payee added. The agent can pay it after the 5-minute cool-down."); },
    resetask() {
      $("#modal").innerHTML = `<div class="scrim" role="dialog" aria-modal="true" aria-labelledby="rt"><div class="wallet pop-in"><div class="body"><h2 id="rt" style="font-size:24px">Reset the demo?</h2><p style="color:var(--body)">This redeploys the contracts and reloads the starting ledger. Every bill, case and payment from this session disappears from the desk.</p></div><footer><button class="btn btn-quiet" id="rk">Keep everything</button><button class="btn btn-stop" id="rr">Reset</button></footer></div></div>`;
      $("#rk").onclick = () => ($("#modal").innerHTML = ""); $("#rr").onclick = () => { $("#modal").innerHTML = ""; const r = S.role; S = seed(); S.role = r; go("desk"); toast("Demo reset"); };
    },
    fixnet() { S.wrongNet = false; render(); },
    proto() { S.proto = !S.proto; renderProto(); },
    reset() { const r = S.role; S = seed(); S.role = r; S.proto = true; render(); toast("Sample data reset"); },
  };
  if (H[a] && !(t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA")) { e.preventDefault?.(); H[a](); }
});
document.addEventListener("change", (e) => {
  const t = e.target; const a = t.dataset?.act;
  if (a === "simrej") S.simulateReject = t.checked;
  if (a === "flag") { S[t.dataset.f] = t.checked; if (t.dataset.f === "paused" && t.checked) S.pausedBy = "Paused by the agent itself after 3 blocked attempts."; render(); }
  if (a === "protorole") { S.role = t.value; render(); }
  if (a === "filter") { S.logFilter = t.value; render(); }
  if (a === "seconly") { S.secOnly = t.checked; render(); }
});
document.addEventListener("input", (e) => { if (e.target.id === "req") S.req = e.target.value; if (e.target.id === "reply") S.reply = e.target.value; });
document.addEventListener("submit", (e) => { e.preventDefault(); if (e.target.dataset.act === "ask") { ask($("#req").value); render(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { $("#modal").innerHTML = ""; if (S.menu) { S.menu = false; render(); } } });
document.addEventListener("mousemove", (e) => { const c = e.target.closest?.(".spot"); if (!c) return; const r = c.getBoundingClientRect(); c.style.setProperty("--mx", e.clientX - r.left + "px"); c.style.setProperty("--my", e.clientY - r.top + "px"); });
addEventListener("scroll", () => { const n = $("#lnav"); if (n) n.classList.toggle("scrolled", scrollY > 8); }, { passive: true });
addEventListener("hashchange", route);

function takeDoc(key) {
  const d = S.inbox.find((x) => x.key === key); d.taken = true;
  const sunPaid = S.inbox.some((x) => (x.key === "SUN" || x.key === "SUNP") && x.key !== key && x.taken);
  const id = "IN" + key;
  if (key === "KAI") { S.bills[id] = { id, sup: d.sup, inv: d.inv, amount: d.amount, status: "paid", hash: "0x5a7d…70b6", due: "3 Jan 2026" }; S.tally.t1 += d.amount; S.tally.t1n++; log("contract", "Paid " + d.inv + " on its own, " + money(d.amount), "0x5a7d…70b6"); toast("Paid " + money(d.amount) + " to " + d.sup, "0x5a7d…70b6"); }
  else if ((key === "SUN" || key === "SUNP") && sunPaid) { S.bills[id] = { id, sup: d.sup, inv: d.inv, amount: d.amount, status: "dup", kind: d.kind }; S.tally.dup += d.amount; log("agent", "Rejected a duplicate of " + d.inv + " (" + d.kind + ")", null, true); toast("Duplicate stopped: " + d.inv); }
  else if (key === "SUN" || key === "SUNP") { const h = hash(); S.bills[id] = { id, sup: d.sup, inv: d.inv, amount: 2349.65, status: "early", hash: h, due: "2 Jan 2026" }; S.tally.t1 += 2349.65; S.tally.t1n++; S.tally.disc += 47.95; log("contract", "Paid " + d.inv + " early, 2% discount taken", h); toast("Paid early to take the 2% discount", h); }
  else if (key === "HAR") { S.bills[id] = { id, sup: d.sup, inv: d.inv, amount: d.amount, status: "scheduled", due: "4 Jan 2026" }; log("agent", "Scheduled " + d.inv + " for 3 Jan"); }
  S.selected = id; S.plan = null; S.answer = null; render();
}
function takeEmail(key) {
  const em = S.emails.find((x) => x.key === key); em.taken = true;
  if (key === "LION") { const h = "0x51fd…0831"; S.frozen.LIONROCK = true; S.cases.C002 = { id: "C002", kind: "bank", sup: "Lion Rock Copper Trading Ltd", status: "open", hash: h }; S.tally.att++; log("agent", "Froze Lion Rock: bank change requested by email", h, true); S.selected = "C002"; toast("The agent froze Lion Rock and opened a case", h); }
  else { S.tally.att++; log("agent", "Ignored an email from a look-alike domain (acme-meta1s.hk)", null, true); S.uploadErr = "lookalike_sender.eml: the sender’s domain doesn’t match a registered supplier, so nothing was recorded."; }
  S.plan = null; S.answer = null; render();
}

/* ClickSpark (React Bits-style) */
function clickSpark(e) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let i = 0; i < 8; i++) {
    const s = document.createElement("span"); s.className = "spark";
    const ang = (i / 8) * Math.PI * 2, d = 26 + Math.random() * 10;
    s.style.left = e.clientX - 3 + "px"; s.style.top = e.clientY - 3 + "px";
    s.style.setProperty("--dx", Math.cos(ang) * d + "px"); s.style.setProperty("--dy", Math.sin(ang) * d + "px");
    document.body.appendChild(s); setTimeout(() => s.remove(), 520);
  }
}
/* speech bubble cycle on the landing page */
let li = 0; setInterval(() => { const b = $("#bubble"); if (!b) return; li = (li + 1) % LINES.length; b.textContent = LINES[li]; b.classList.remove("pop-in"); void b.offsetWidth; b.classList.add("pop-in"); }, 3200);

route();
