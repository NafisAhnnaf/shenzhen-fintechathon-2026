<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="240" height="221" role="img" aria-label="A bank"><style>.bob{animation:bob 3.2s ease-in-out infinite}.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}.wave{transform-box:fill-box;transform-origin:20% 95%;animation:wave 1.6s ease-in-out infinite}.sway,.antenna{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><polygon points="20,70 120,16 220,70" fill="#4B3BD6"/><circle cx="120" cy="50" r="12" fill="#B8AEFF"/><rect x="30" y="70" width="180" height="14" fill="#6D5BFF"/><g fill="#B8AEFF"><rect x="44" y="92" width="22" height="90" rx="4"/><rect x="88" y="92" width="22" height="90" rx="4"/><rect x="132" y="92" width="22" height="90" rx="4"/><rect x="176" y="92" width="22" height="90" rx="4"/></g><rect x="24" y="182" width="192" height="20" rx="4" fill="#4B3BD6"/></svg>