<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="The contract vault"><style>.bob{animation:bob 3.2s ease-in-out infinite}.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}.wave{transform-box:fill-box;transform-origin:20% 95%;animation:wave 1.6s ease-in-out infinite}.sway,.antenna{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="16" y="16" width="168" height="168" rx="28" fill="#4B3BD6"/><g class="sway"><circle cx="100" cy="100" r="56" fill="#6D5BFF" stroke="#B8AEFF" stroke-width="8"/><path d="M100 56 L100 144 M56 100 L144 100" stroke="#E4E0FF" stroke-width="8" stroke-linecap="round"/><circle cx="100" cy="100" r="16" fill="#E4E0FF"/></g><rect x="152" y="70" width="14" height="30" rx="6" fill="#B8AEFF"/></svg>